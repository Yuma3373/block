name: Android APK

# Shell steps only: the repository allows no third-party actions.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        run: |
          git init -q src
          cd src
          git fetch -q --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Build APK
        working-directory: src/android
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk shorts-reels-blocker.apk

      # A release gives a direct .apk link that opens on a phone.
      - name: Publish release
        working-directory: src/android
        run: |
          gh release create "apk-build-$GITHUB_RUN_NUMBER" shorts-reels-blocker.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "쇼츠·릴스 차단 APK (빌드 $GITHUB_RUN_NUMBER)" \
            --notes "휴대폰에서 아래 shorts-reels-blocker.apk를 눌러 내려받아 설치하세요."
